name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  UEFI_TARGET: x86_64-unknown-uefi

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The UEFI application is its own workspace, so it has to be
          # listed separately or its target dir is never cached.
          workspaces: |
            .
            crates/bootfixr

      # The integration tests build real disk images with sgdisk and use it
      # as the oracle for whether a repair worked.
      - name: Install gdisk
        run: |
          sudo apt-get update
          sudo apt-get install -y gdisk

      - name: Formatting
        run: make fmt-check

      - name: Clippy
        run: make clippy

      - name: Tests
        run: make test

  build:
    name: Build EFI binary
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the build stamps the binary with `git describe`,
      # and the default shallow clone has neither the tags nor the commit count
      # that needs. See crates/bootfixr/build.rs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/bootfixr

      # bootfixr-tiny.efi is UPX-compressed as part of `make dist`.
      - uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Build and stage
        run: make dist

      # The whole point of the stamp is that a binary someone is running months
      # later can be traced back to a commit, so a build that lost it should
      # fail here rather than ship anonymously. bootfixr-tiny.efi carries the
      # same stamp but is not checked here: UPX compresses the string away,
      # so grepping for it would fail on a correctly-built binary.
      - name: Check the binary names its commit
        run: |
          set -euo pipefail
          echo "git describe: $(git describe --tags --always --dirty --match 'v*')"
          if git describe --tags --exact-match --match 'v*' HEAD >/dev/null 2>&1; then
            echo "exact tag: the binary reports the package version alone"
            exit 0
          fi
          short=$(git rev-parse --short=7 HEAD)
          grep -qa "g$short" build/dist/bootfixr.efi \
            || { echo "build/dist/bootfixr.efi does not mention commit $short" >&2; exit 1; }
          echo "ok: build/dist/bootfixr.efi names commit $short"

      # Cheap guard against shipping something that is not a bootable EFI
      # application, e.g. if the target or subsystem ever changes. Covers
      # bootfixr-tiny.efi too: UPX rewrites the PE header, and this is what
      # catches it if that ever stopped landing on a valid one.
      - name: Verify PE32+ headers
        run: |
          for efi in build/dist/bootfixr.efi build/dist/bootfixr-tiny.efi; do
            python3 - "$efi" <<'EOF'
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          assert data[:2] == b'MZ', "missing MZ magic"
          pe = struct.unpack_from('<I', data, 0x3c)[0]
          assert data[pe:pe+4] == b'PE\0\0', "missing PE signature"
          machine, = struct.unpack_from('<H', data, pe + 4)
          magic,   = struct.unpack_from('<H', data, pe + 24)
          subsys,  = struct.unpack_from('<H', data, pe + 92)
          assert machine == 0x8664, f"machine {machine:#x}, expected x86_64"
          assert magic == 0x20b, f"optional header {magic:#x}, expected PE32+"
          assert subsys == 10, f"subsystem {subsys}, expected 10 (EFI application)"
          print(f"ok: {sys.argv[1]}: PE32+ x86_64 EFI application, {len(data)} bytes")
          EOF
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bootfixr
          path: build/dist/
          if-no-files-found: error

  continuous:
    name: Continuous prerelease
    needs: [test, build]
    # Tracks whatever the repository's default branch is called, so this
    # does not silently stop firing if the branch is main or master.
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootfixr
          path: dist

      - name: Replace the continuous prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Remove the previous rolling release and its tag. Both are
          # tolerated as missing: the first run has neither, and a tag can
          # outlive its release if a run was cancelled midway.
          gh release delete continuous --cleanup-tag --yes || true
          git push --delete origin continuous || true

          cat > notes.md <<EOF
          Rolling build of the default branch, replaced on every push.
          **Unsigned and untested on your hardware** - prefer a tagged release
          if one exists.

          Commit: \`${GITHUB_SHA}\`
          Built: $(date -u '+%Y-%m-%d %H:%M UTC')

          The binary prints its version on the first screen, and that version
          carries this commit (\`g${GITHUB_SHA:0:7}\`). Quote it when reporting
          anything, so it is clear which build you were running.

          ## Install

          Copy to the EFI system partition:

          \`\`\`sh
          sha256sum -c SHA256SUMS
          cp bootfixr.efi /esp/EFI/bootfixr.efi
          \`\`\`

          Then shut the Deck down, hold **Volume Up (+)** and tap **Power** to
          reach the Boot Manager, and choose "Boot From File" -> the ESP ->
          \`bootfixr.efi\`. Deliberately not an NVRAM boot entry, since SteamOS
          rewrites the boot order on update. Secure Boot must be off, as the
          binary is unsigned.

          Nothing is written until you enter the five-press confirmation
          sequence (LEFT RIGHT LEFT RIGHT A), and every write names the exact
          LBAs first. The disk this image was launched from is a valid target -
          that is the whole point - and is labelled \`[boot]\` in the picker.

          If the ESP has no room to spare, \`bootfixr-tiny.efi\` is a
          UPX-compressed build with only the 12x24 font cell baked in -
          smaller on disk, at the cost of the text-size choice on the
          Display screen.

          Full instructions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md
          EOF

          gh release create continuous dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Continuous build (${GITHUB_SHA:0:7})" \
            --notes-file notes.md

  release:
    name: Draft release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: bootfixr
          path: dist

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Install

          Copy to the EFI system partition:

          \`\`\`sh
          sha256sum -c SHA256SUMS
          cp bootfixr.efi /esp/EFI/bootfixr.efi
          \`\`\`

          Then shut the Deck down, hold **Volume Up (+)** and tap **Power** to
          reach the Boot Manager, and choose "Boot From File" -> the ESP ->
          \`bootfixr.efi\`. Deliberately not an NVRAM boot entry, since SteamOS
          rewrites the boot order on update. Secure Boot must be off, as this
          binary is unsigned.

          Nothing is written until you enter the five-press confirmation
          sequence (LEFT RIGHT LEFT RIGHT A), and every write names the exact
          LBAs first. The disk this image was launched from is a valid target -
          that is the whole point - and is labelled \`[boot]\` in the picker.

          If the ESP has no room to spare, \`bootfixr-tiny.efi\` is a
          UPX-compressed build with only the 12x24 font cell baked in -
          smaller on disk, at the cost of the text-size choice on the
          Display screen.

          Full instructions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md

          EOF

          # --generate-notes appends the commit log below the text above.
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes
