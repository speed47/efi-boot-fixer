[package]
name = "bootfixr"
version = "1.2.0"
edition = "2021"
rust-version = "1.85"

[workspace]

[features]
# Keeps only the 12x24 font cell, for a build small enough to UPX-compress
# onto an ESP that has no room for both the full font and bootfixr.efi. See
# crates/bootfixr/src/gfx/console.rs.
tiny = []

[dependencies]
gptcore = { path = "../gptcore" }
uefi-raw = "0.9"
uefi = { version = "0.33", features = ["alloc", "global_allocator", "panic_handler"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
