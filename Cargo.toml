[workspace]
resolver = "2"
members = ["crates/gptcore"]
# The UEFI application lives in its own workspace: it only builds for
# x86_64-unknown-uefi, so it must not be pulled into a host `cargo test`.
exclude = ["crates/bootfixr"]

[workspace.package]
version = "1.2.1"
edition = "2021"
license = "MIT"
# Keep this buildable on the toolchain the dev sandbox pins (1.85), not just
# on whatever CI's `stable` has drifted to. Code that needs a newer stdlib
# API gets the older spelling plus a targeted clippy allow instead.
rust-version = "1.85"
